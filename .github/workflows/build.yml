name: Build & deploy dashboard

# Rebuilds the processed data and re-renders the dashboard, then publishes it to
# GitHub Pages. Runs automatically whenever you push new data, once a week as a
# safety net, and on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "index.qmd"
      - "custom.scss"
      - "_quarto.yml"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"
  schedule:
    - cron: "0 9 * * 1"        # Mondays 09:00 UTC (~06:00 in Joinville)
  workflow_dispatch:            # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build processed data (QC, aggregation, extreme-event flags)
        run: python scripts/build_data.py

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render dashboard
        run: quarto render index.qmd --to dashboard

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
